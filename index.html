<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Đồng Bộ Google Sheet</title>
    <style>
        /* CSS Giao diện chuẩn */
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #spin-wrapper { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            background: url('background.png') center/cover no-repeat; 
        }
        
        /* Vòng quay - Thêm pointer-events để chuột bấm xuyên qua được */
        #circle { 
            width: 90%; 
            max-width: 500px; 
            position: absolute; 
            top: 120px; left: 0; right: 0; bottom: 0; 
            margin: auto; 
            z-index: 1; 
            pointer-events: none; 
            transition: transform 3s ease-out; 
        }
        
        /* Nút quay / Kim chỉ ở giữa - ĐÃ TĂNG LÊN 360PX (GẤP 4 LẦN) */
        #spinner { 
            width: 500px; /* Thay đổi kích thước tại đây */
            position: absolute; 
            top: 120px; left: 0; right: 0; bottom: 0; 
            margin: auto; 
            z-index: 50; 
            cursor: pointer; 
            pointer-events: auto; 
            animation: zoom-in-out 0.6s infinite alternate; 
        }
        
        /* Khi đang xoay thì khóa không cho bấm tiếp */
        .disabled { pointer-events: none !important; opacity: 0.7; filter: grayscale(30%); }
        
        @keyframes zoom-in-out { 0% { transform: scale(0.95); } 100% { transform: scale(1.02); } }
        
        /* Giao diện Popup */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 99; opacity: 0; pointer-events: none; transition: 0.3s; }
        #form { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: white; padding: 25px; border-radius: 12px; display: flex; flex-direction: column; gap: 15px; z-index: 100; transition: transform 0.3s ease-out; min-width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        #form.active { transform: translate(-50%, -50%) scale(1); }
        .overlay.active { opacity: 1; pointer-events: auto; }
        #form h2 { color: #cc0000; font-size: 1.4rem; margin-bottom: 5px; }
        #form input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        #form button { padding: 12px; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 1rem; transition: 0.2s; }
        #submit { background: #e60000; }
        #submit:hover { background: #b30000; }
        .close-btn { background: #555 !important; margin-top: -5px; }
        .close-btn:hover { background: #333 !important; }
    </style>
</head>
<body>

    <div id="spin-wrapper">
        <img id="circle" src="circle.png" alt="Vòng quay">
        <img id="spinner" src="spinner.png" alt="Nút quay">
    </div>

    <div class="overlay" id="overlay"></div>
    <div id="form">
        <h2 id="reward-title">Chúc mừng bạn!</h2>
        <div id="input-fields" style="display: flex; flex-direction: column; gap: 12px;">
            <input type="text" id="name" placeholder="Họ và tên của bạn">
            <input type="text" id="phone" placeholder="Số điện thoại nhận giải">
        </div>
        <button id="submit">Xác nhận nhận quà</button>
        <button id="close" class="close-btn">Quay tiếp lượt mới</button>
    </div>

    <script>
        // ================= CẤU HÌNH LIÊN KẾT GOOGLE SHEET =================
        const SCRIPT_URL = "DÁN_ĐƯỜNG_LINK_WEB_APP_CỦA_BẠN_VÀO_ĐÂY";
        
        // Cấu hình tỷ lệ trúng thưởng (Tổng phải <= 100)
        const RATE_XE_DIEN = 10; // 10% trúng xe điện
        const RATE_MU_BH = 40;   // 40% trúng mũ bảo hiểm
        // =================================================================

        const spinner = document.getElementById('spinner');
        const circle = document.getElementById('circle');
        const form = document.getElementById('form');
        const overlay = document.getElementById('overlay');
        const rewardTitle = document.getElementById('reward-title');
        const inputFields = document.getElementById('input-fields');
        const closeBtn = document.getElementById('close');
        const submitBtn = document.getElementById('submit');
        
        let totalDegrees = 0; 
        let reward = "";

        // Hàm gọi lên Sheet lấy số lượng tồn kho xe điện thực tế
        async function checkLiveStock() {
            if (!SCRIPT_URL || SCRIPT_URL.includes("DÁN_ĐƯỜNG_LINK")) return 5; 
            try {
                let response = await fetch(SCRIPT_URL);
                let json = await response.json();
                return parseInt(json.data) || 0;
            } catch (e) {
                return 0; 
            }
        }

        spinner.addEventListener('click', async () => {
            spinner.classList.add('disabled');

            // Kiểm tra kho thực tế trên Sheet trước khi xoay
            const currentStock = await checkLiveStock();
            
            let random = Math.floor(Math.random() * 100); 
            let targetDegrees = 0; 

            if (random >= 0 && random < RATE_XE_DIEN && currentStock > 0) {
                targetDegrees = 270; // Ô ĐỎ ở dưới
                reward = "Xe máy điện ICON e:";
            } 
            else if (random >= RATE_XE_DIEN && random < (RATE_XE_DIEN + RATE_MU_BH)) {
                targetDegrees = 30; // Ô TRẮNG bên phải
                reward = "Mũ bảo hiểm 3/4";
            } 
            else {
                targetDegrees = 150; // Ô TRẮNG bên trái
                reward = "Chúc bạn may mắn lần sau";
            }

            let currentMod = totalDegrees % 360;
            let diff = targetDegrees - currentMod;
            if (diff <= 0) diff += 360; 
            
            totalDegrees += (360 * 4) + diff; 
            circle.style.transform = `rotate(${totalDegrees}deg)`;

            setTimeout(() => {
                if (reward === "Chúc bạn may mắn lần sau") {
                    rewardTitle.innerText = reward;
                    inputFields.style.display = "none"; 
                    submitBtn.style.display = "none";     
                } else {
                    rewardTitle.innerText = `Tuyệt vời! Bạn đã trúng: ${reward}`;
                    inputFields.style.display = "flex"; 
                    submitBtn.style.display = "block";
                }
                form.classList.add('active');
                overlay.classList.add('active');
            }, 3000); 
        });

        closeBtn.addEventListener('click', () => {
            form.classList.remove('active');
            overlay.classList.remove('active');
            spinner.classList.remove('disabled'); 
        });

        // XỬ LÝ LƯU DATA LÊN GOOGLE SHEET KHI BẤM XÁC NHẬN
        submitBtn.addEventListener('click', async () => {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            
            if (!name || !phone) {
                alert("Vui lòng nhập đầy đủ thông tin để nhận giải!");
                return;
            }

            submitBtn.innerText = "Đang lưu vào Sheet...";
            submitBtn.style.pointerEvents = "none";

            if (SCRIPT_URL && !SCRIPT_URL.includes("DÁN_ĐƯỜNG_LINK")) {
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({ name: name, phone: phone, reward: reward })
                    });
                } catch (error) {
                    console.error("Lỗi kết nối Sheet:", error);
                }
            }

            alert(`Chúc mừng ${name}! Thông tin đã được đồng bộ lên Google Sheet.`);
            
            submitBtn.innerText = "Xác nhận nhận quà";
            submitBtn.style.pointerEvents = "auto";
            form.classList.remove('active');
            overlay.classList.remove('active');
            spinner.classList.remove('disabled');
            document.getElementById('name').value = "";
            document.getElementById('phone').value = "";
        });
    </script>
</body>
</html>
