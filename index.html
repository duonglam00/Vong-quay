<script>
    // ================= CẤU HÌNH LIÊN KẾT GOOGLE SHEET =================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCcEAzB0-T9vkYVQazW3h5z7clF6Nyu9-9mxPMaNEU5gVqevO_WqPiWhLC_0HiR3hi/exec";
    
    // TỶ LỆ TRÚNG THƯỞNG THEO YÊU CẦU MỚI
    const RATE_XE_DIEN = 3;   // 3% trúng xe máy điện
    const RATE_MU_BH = 20;    // 20% trúng mũ bảo hiểm
    // (77% còn lại tự động rơi vào ô "Chúc bạn may mắn lần sau")
    // =================================================================

    const spinner = document.getElementById('spinner');
    const circle = document.getElementById('circle');
    const overlay = document.getElementById('overlay');
    
    const infoPopup = document.getElementById('info-popup');
    const submitInfoBtn = document.getElementById('submit-info');
    
    const rewardPopup = document.getElementById('reward-popup');
    const rewardTitle = document.getElementById('reward-title');
    const rewardImg = document.getElementById('reward-img');
    const closeRewardBtn = document.getElementById('close-reward');
    
    let totalDegrees = 0; 
    let isSpinning = false;
    let reward = "";

    let savedName = "";
    let savedPhone = "";

    // Hàm kiểm tra số lượng tồn kho thực tế từ ô F2 trên Google Sheet
    async function checkLiveStock() {
        if (!SCRIPT_URL) return 0; 
        try {
            let response = await fetch(SCRIPT_URL);
            let json = await response.json();
            return parseInt(json.data) || 0;
        } catch (e) {
            console.error("Lỗi kết nối kiểm tra kho:", e);
            return 0; // Nếu lỗi mạng, mặc định coi như bằng 0 để an toàn cho kho
        }
    }

    // 1. XỬ LÝ KHI BẤM NÚT XÁC NHẬN THÔNG TIN
    submitInfoBtn.addEventListener('click', () => {
        savedName = document.getElementById('name').value.trim();
        savedPhone = document.getElementById('phone').value.trim();
        
        if (!savedName || !savedPhone) {
            alert("Vui lòng nhập đầy đủ họ tên và số điện thoại để tham gia!");
            return;
        }

        // Ẩn popup nhập thông tin để chuẩn bị chơi
        infoPopup.classList.remove('active');
        overlay.classList.remove('active');
        
        // QUAN TRỌNG: Gỡ bỏ class disabled để kích hoạt nút quay nhấp nháy!
        spinner.classList.remove('disabled');
    });

    // 2. XỬ LÝ KHI BẤM NÚT QUAY (SPINNER)
    spinner.addEventListener('click', async () => {
        if (isSpinning) return; // Nếu đang quay thì chặn không cho bấm tiếp
        isSpinning = true;
        spinner.classList.add('disabled'); // Khóa nút quay lại ngay lúc đang xoay

        // Bước A: Gọi lên Google Sheet check xem ô F2 đang là 1 hay 0
        const currentStock = await checkLiveStock();

        // Bước B: Thuật toán tính toán phần thưởng ngẫu nhiên (Từ 0 đến 99)
        let random = Math.floor(Math.random() * 100);
        let targetAngle = 0; // Góc quay mục tiêu

        // KIỂM TRA ĐIỀU KIỆN TRÚNG XE ĐIỆN (Phải trúng tỷ lệ 3% VÀ Kho F2 phải > 0)
        if (random < RATE_XE_DIEN && currentStock > 0) {
            reward = "Xe máy điện ICON e:";
            targetAngle = 60; // Tọa độ ô Xe điện trên ảnh vòng quay của cậu (Cậu tùy chỉnh lại số độ này nha)
            rewardImg.src = "xe-dien.png"; // Thay bằng link ảnh xe điện của cậu
        } 
        // TRÚNG MŨ BẢO HIỂM (Tỷ lệ từ 3% đến 23%)
        else if (random < (RATE_XE_DIEN + RATE_MU_BH)) {
            reward = "Mũ bảo hiểm";
            targetAngle = 180; // Tọa độ ô Mũ bảo hiểm (Cậu tùy chỉnh lại nha)
            rewardImg.src = "mu-bao-hiem.png"; // Thay bằng link ảnh mũ bảo hiểm
        } 
        // MAY MẮN LẦN SAU (77% còn lại hoặc khi xe điện trúng nhưng kho bằng 0)
        else {
            reward = "Chúc bạn may mắn lần sau";
            targetAngle = 300; // Tọa độ ô May mắn (Cậu tùy chỉnh lại nha)
            rewardImg.src = "may-man.png"; // Thay bằng link ảnh mặt mếu/may mắn lần sau
        }

        // Bước C: Tính tổng số độ quay (Quay ít nhất 5 vòng = 1800 độ để tạo hiệu ứng đẹp mắt)
        totalDegrees += 1800 + (360 - (totalDegrees % 360)) + targetAngle;
        circle.style.transform = `rotate(${totalDegrees}deg)`;

        // Bước D: Đợi vòng quay dừng hẳn (3 giây giống CSS transition) rồi hiển thị kết quả
        setTimeout(async () => {
            // Cập nhật nội dung Popup kết quả
            if (reward === "Chúc bạn may mắn lần sau") {
                rewardTitle.innerHTML = `Tiếc quá!<br><span style="font-size:1.1rem; color:#555; font-weight:normal;">Chúc bạn may mắn lần sau nhé!</span>`;
            } else {
                rewardTitle.innerHTML = `Chúc mừng bạn!<br><span style="font-size:1.2rem; color:#e60000;">Bạn đã trúng: ${reward}</span>`;
            }
            
            // Hiển thị Popup phần thưởng
            overlay.classList.add('active');
            rewardPopup.classList.add('active');

            // Bước E: Âm thầm gửi dữ liệu lên Google Sheet để lưu thông tin và trừ kho F2
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Dùng chế độ no-cors để bypass bộ chặn bảo mật của Google
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: savedName,
                        phone: savedPhone,
                        reward: reward
                    })
                });
            } catch (error) {
                console.error("Lỗi khi đồng bộ lên Google Sheet:", error);
            }

            isSpinning = false;
        }, 3100); // 3100ms để trừ hao thời gian mượt mà sau hiệu ứng dừng quay
    });

    // 3. XỬ LÝ KHI BẤM NÚT QUAY TIẾP LƯỢT MỚI
    closeRewardBtn.addEventListener('click', () => {
        // Ẩn popup thông báo quà đi
        rewardPopup.classList.remove('active');
        
        // Reset sạch dữ liệu form cũ để người tiếp theo nhập
        document.getElementById('name').value = "";
        document.getElementById('phone').value = "";
        
        // Hiện lại popup thông tin từ đầu
        infoPopup.classList.add('active');
        overlay.classList.add('active');
    });
</script>
