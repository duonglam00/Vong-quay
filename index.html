<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Đồng Bộ Google Sheet</title>
    <style>
        /* CSS Giao diện chuẩn */
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #spin-wrapper { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            background: url('background.png') center/cover no-repeat; 
        }
        
        /* Vòng quay */
        #circle { 
            width: 90%; 
            max-width: 500px; 
            position: absolute; 
            top: 120px; left: 0; right: 0; bottom: 0; 
            margin: auto; 
            z-index: 1; 
            pointer-events: none; 
            transition: transform 3s ease-out; 
        }
        
        /* Nút quay / Kim chỉ ở giữa */
        #spinner { 
            width: 500px; 
            position: absolute; 
            top: 120px; left: 0; right: 0; bottom: 0; 
            margin: auto; 
            z-index: 50; 
            cursor: pointer; 
            pointer-events: auto; 
            animation: zoom-in-out 0.6s infinite alternate; 
        }
        
        /* Khóa vòng quay khi đang xử lý */
        .disabled { pointer-events: none !important; opacity: 0.7; filter: grayscale(30%); }
        
        @keyframes zoom-in-out { 0% { transform: scale(0.95); } 100% { transform: scale(1.02); } }
        
        /* Nền mờ phía sau các Popup */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 99; opacity: 0; pointer-events: none; transition: 0.3s; }
        .overlay.active { opacity: 1; pointer-events: auto; }

        /* Khung Popup Chung */
        .popup-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: white; padding: 28px; border-radius: 16px; display: flex; flex-direction: column; gap: 15px; z-index: 100; transition: transform 0.3s ease-out; min-width: 340px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.35); }
        .popup-box.active { transform: translate(-50%, -50%) scale(1); }
        
        /* 1. Giao diện POPUP NHẬP THÔNG TIN */
        #info-popup h2 { color: #333; font-size: 1.35rem; margin-bottom: 5px; }
        #info-popup input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; transition: 0.2s; }
        #info-popup input:focus { border-color: #e60000; box-shadow: 0 0 5px rgba(230,0,0,0.2); }
        #submit-info { padding: 13px; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; font-size: 1rem; background: #e60000; transition: 0.2s; }
        #submit-info:hover { background: #b30000; }

        /* 2. Giao diện POPUP PHẦN THƯỞNG (Được làm đẹp cao cấp) */
        #reward-popup h2 { color: #cc0000; font-size: 1.5rem; line-height: 1.4; }
        
        /* Khung chứa ảnh quà */
        .reward-img-container { width: 100%; display: flex; justify-content: center; align-items: center; margin: 10px 0; min-height: 150px; }
        .reward-img-container img { max-width: 180px; max-height: 180px; object-fit: contain; animation: bounce 0.8s ease-out; }
        
        #close-reward { padding: 12px; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; font-size: 1rem; background: #333; transition: 0.2s; }
        #close-reward:hover { background: #000; }

        @keyframes bounce {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="spin-wrapper">
        <img id="circle" src="circle.png" alt="Vòng quay">
        <img id="spinner" src="spinner.png" alt="Nút quay">
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="popup-box" id="info-popup">
        <h2>Nhập thông tin để nhận lượt quay</h2>
        <input type="text" id="name" placeholder="Họ và tên của bạn">
        <input type="text" id="phone" placeholder="Số điện thoại của bạn">
        <button id="submit-info">Xác nhận & Quay ngay</button>
    </div>

    <div class="popup-box" id="reward-popup">
        <h2 id="reward-title">Chúc mừng bạn!</h2>
        <div class="reward-img-container">
            <img id="reward-img" src="" alt="Hình ảnh phần thưởng">
        </div>
        <button id="close-reward">Quay tiếp lượt mới</button>
    </div>

    <script>
        // ================= CẤU HÌNH LIÊN KẾT GOOGLE SHEET =================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCcEAzB0-T9vkYVQazW3h5z7clF6Nyu9-9mxPMaNEU5gVqevO_WqPiWhLC_0HiR3hi/exec";
        
        // Cấu hình tỷ lệ trúng thưởng (Tổng phải <= 100)
        const RATE_XE_DIEN = 10; // 10% trúng xe điện
        const RATE_MU_BH = 40;   // 40% trúng mũ bảo hiểm
        // =================================================================

        const spinner = document.getElementById('spinner');
        const circle = document.getElementById('circle');
        const overlay = document.getElementById('overlay');
        
        // Các thành phần của Popup nhập thông tin
        const infoPopup = document.getElementById('info-popup');
        const submitInfoBtn = document.getElementById('submit-info');
        
        // Các thành phần của Popup hiển thị quà
        const rewardPopup = document.getElementById('reward-popup');
        const rewardTitle = document.getElementById('reward-title');
        const rewardImg = document.getElementById('reward-img');
        const closeRewardBtn = document.getElementById('close-reward');
        
        let totalDegrees = 0; 
        let reward = "";

        // Hàm gọi lên Sheet lấy số lượng tồn kho xe điện thực tế
        async function checkLiveStock() {
            if (!SCRIPT_URL || SCRIPT_URL.includes("DÁN_ĐƯỜNG_LINK")) return 5; 
            try {
                let response = await fetch(SCRIPT_URL);
                let json = await response.json();
                return parseInt(json.data) || 0;
            } catch (e) {
                return 0; 
            }
        }

        // BƯỚC 1: Bấm nút giữa vòng quay -> Chưa xoay ngay mà hiện Form bắt nhập thông tin trước
        spinner.addEventListener('click', () => {
            if (spinner.classList.contains('disabled')) return;
            
            // Hiện Popup nhập thông tin
            infoPopup.classList.add('active');
            overlay.classList.add('active');
        });

        // BƯỚC 2: Khách điền thông tin xong bấm nút "Xác nhận & Quay ngay"
        submitInfoBtn.addEventListener('click', async () => {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            
            if (!name || !phone) {
                alert("Vui lòng nhập đầy đủ họ tên và số điện thoại để tham gia!");
                return;
            }

            // Đổi trạng thái nút để tránh bấm liên tục lúc đang check kho
            submitInfoBtn.innerText = "Đang xử lý...";
            submitInfoBtn.style.pointerEvents = "none";

            // Kiểm tra kho thực tế trên Sheet trước khi quyết định giải thưởng
            const currentStock = await checkLiveStock();
            
            let random = Math.floor(Math.random() * 100); 
            let targetDegrees = 0; 

            // Thuật toán tính giải thưởng
            if (random >= 0 && random < RATE_XE_DIEN && currentStock > 0) {
                targetDegrees = 270; // Ô ĐỎ ở dưới
                reward = "Xe máy điện ICON e:";
            } 
            else if (random >= RATE_XE_DIEN && random < (RATE_XE_DIEN + RATE_MU_BH)) {
                targetDegrees = 30; // Ô TRẮNG bên phải
                reward = "Mũ bảo hiểm 3/4";
            } 
            else {
                targetDegrees = 150; // Ô TRẮNG bên trái
                reward = "Chúc bạn may mắn lần sau";
            }

            // Tắt Popup nhập thông tin để nhường chỗ cho vòng quay hoạt động
            infoPopup.classList.remove('active');
            spinner.classList.add('disabled'); // Khóa nút quay chính

            // Tính toán góc quay và kích hoạt xoay bánh xe
            let currentMod = totalDegrees % 360;
            let diff = targetDegrees - currentMod;
            if (diff <= 0) diff += 360; 
            
            totalDegrees += (360 * 4) + diff; 
            circle.style.transform = `rotate(${totalDegrees}deg)`;

            // ĐỒNG BỘ NẦM: Gửi data lên Google Sheet ngay lúc đang xoay (tiết kiệm thời gian)
            if (SCRIPT_URL && !SCRIPT_URL.includes("DÁN_ĐƯỜNG_LINK")) {
                fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ name: name, phone: phone, reward: reward })
                }).catch(error => console.error("Lỗi kết nối âm thầm:", error));
            }

            // BƯỚC 3: Chờ vòng quay xoay xong 3 giây -> Hiện kết quả kèm ảnh quà tương ứng
            setTimeout(() => {
                if (reward === "Chúc bạn may mắn lần sau") {
                    rewardTitle.innerHTML = "Tiếc quá!<br>Chúc bạn may mắn lần sau nhé";
                    rewardImg.src = "may-man.png"; // Ảnh icon buồn hoặc may mắn lần sau
                } else {
                    rewardTitle.innerHTML = `Tuyệt vời! Bạn đã trúng:<br><span style="color:#e60000">${reward}</span>`;
                    
                    // Tự động đổi ảnh theo đúng phần quà trúng
                    if (reward === "Xe máy điện ICON e:") {
                        rewardImg.src = "xe-dien.png"; 
                    } else if (reward === "Mũ bảo hiểm 3/4") {
                        rewardImg.src = "mu-bao-hiem.png"; 
                    }
                }

                // Hiện popup thông báo quà
                rewardPopup.classList.add('active');
                
                // Khôi phục lại trạng thái nút nhập thông tin ban đầu cho lượt sau
                submitInfoBtn.innerText = "Xác nhận & Quay ngay";
                submitInfoBtn.style.pointerEvents = "auto";
            }, 3000); 
        });

        // BƯỚC 4: Bấm nút đóng ở bảng nhận quà để reset trò chơi mới
        closeRewardBtn.addEventListener('click', () => {
            rewardPopup.classList.remove('active');
            overlay.classList.remove('active');
            spinner.classList.remove('disabled'); // Mở khóa vòng quay cho người tiếp theo
            
            // Xóa sạch thông tin cũ trong ô nhập liệu
            document.getElementById('name').value = "";
            document.getElementById('phone').value = "";
        });
    </script>
</body>
</html>
